name: Python package

on:
  push:
    branches: [ "template", "main" ]
  pull_request:
    branches: [ "template", "main" ]

permissions:
  contents: read

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.4.3
        virtualenvs-create: true
        # In-project so the virtualenv can be cached by path below. Local
        # development uses a conda environment and is unaffected by this.
        virtualenvs-in-project: true

    - name: Restore cached virtualenv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ matrix.python-version }}-all-${{ hashFiles('poetry.lock') }}

    # --only main,dev is explicit so that adding an optional group later cannot
    # silently start installing it in CI. --all-extras is required rather than
    # optional here: the unit suite mocks vendor symbols such as
    # anthropic.Anthropic, so the real packages must be importable.
    - name: Install dependencies
      run: poetry install --only main,dev --all-extras

    - name: Check formatting
      run: make format-check

    - name: Lint
      run: make lint

    - name: Run tests
      run: make test

    - name: Coverage check
      run: make coverage

    - name: Optional dependency boundaries
      run: make import-boundaries

    - name: Dependency declarations
      run: make deps-check

    # With every extra installed this can only catch a vendor import that has
    # moved back to module scope -- which is precisely the case the jobs below
    # cannot see.
    - name: Backends stay lazy with every extra installed
      run: make check-extras

    # Builds a wheel and runs the shipped tests against the installed package,
    # catching packaging errors that a source-tree test run cannot see.
    - name: Test the built wheel
      run: make test-wheel

  # The job above runs where every backend is installed, so it passes whether or
  # not the optional-dependency machinery works. These two build environments
  # that really are missing backends, rather than simulating absence with mocks.
  extras:
    name: extra:${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ["anthropic", "openai", "vertex", "ollama"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.4.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install only this extra
      run: poetry install --only main --extras ${{ matrix.extra }}

    - name: Only this backend is usable
      run: poetry run python scripts/check_extras.py ${{ matrix.extra }}

  no-extras:
    name: no extras
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.4.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install with no extras
      run: poetry install --only main

    - name: Importing the package requires no backend
      run: poetry run python scripts/check_extras.py
