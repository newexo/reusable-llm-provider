name: Python package

on:
  push:
    branches: [ "template", "main" ]
  pull_request:
    branches: [ "template", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.3.4
        virtualenvs-create: true
        virtualenvs-in-project: false

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        poetry install --all-extras --with dev

    # Optional: run formatting only as feedback (not required for CI pass)
    # - name: Format code
    #   run: make format

    - name: Lint
      run: make lint

    - name: Run tests
      run: make test

    - name: Coverage check
      run: make coverage

    - name: Backends stay lazy with every extra installed
      run: poetry run python scripts/check_extras.py anthropic openai vertex ollama

  # The suites above run where every backend is installed, so they pass whether
  # or not the optional-dependency machinery works. These two jobs are the ones
  # that can actually fail when it breaks: they build environments that really
  # are missing backends, rather than simulating absence with mocks.
  extras:
    name: extra:${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ["anthropic", "openai", "vertex", "ollama"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.3.4
        virtualenvs-create: true
        virtualenvs-in-project: false

    - name: Install only this extra
      run: poetry install --only main --extras ${{ matrix.extra }}

    - name: Only this backend is usable
      run: poetry run python scripts/check_extras.py ${{ matrix.extra }}

  no-extras:
    name: no extras
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.3.4
        virtualenvs-create: true
        virtualenvs-in-project: false

    - name: Install with no extras
      run: poetry install --only main

    - name: Importing the package requires no backend
      run: poetry run python scripts/check_extras.py
