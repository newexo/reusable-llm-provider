[tool.poetry]
name = "reusable_llm_provider"
version = "0.6.0"
description = "Reusable LLM provider abstraction layer supporting Anthropic, OpenAI, Vertex AI, and Ollama"
authors = ["Reuben Brasher <rkbrasher@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "reusable_llm_provider"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.12.0"
anthropic = {version = ">=0.96.0,<1.0.0", optional = true}
openai = {version = "^2.15.0", optional = true}
langchain-anthropic = {version = "^1.3.1", optional = true}
langchain-openai = {version = "^1.1.7", optional = true}
langchain-ollama = {version = "^1.0.1", optional = true}
google-genai = {version = "^1.61.0", optional = true}
langchain-google-genai = {version = "^4.3.7", optional = true}

[tool.poetry.extras]
anthropic = ["anthropic", "langchain-anthropic"]
openai = ["openai", "langchain-openai"]
vertex = ["google-genai", "langchain-google-genai"]
ollama = ["langchain-ollama"]
all = [
    "anthropic",
    "langchain-anthropic",
    "openai",
    "langchain-openai",
    "google-genai",
    "langchain-google-genai",
    "langchain-ollama",
]

[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.0"
pytest = "^9.0.1"
ruff = "^0.15.11"
coverage = "^7.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["reusable_llm_provider/tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_version.py" = ["F841"]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/functional_tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
