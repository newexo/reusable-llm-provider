[project]
name = "reusable_llm_provider"
version = "0.9.1"
description = "Reusable LLM provider abstraction layer supporting Anthropic, OpenAI, Vertex AI, and Ollama"
authors = [{ name = "Reuben Brasher", email = "rkbrasher@gmail.com" }]
license = "MIT"
readme = "README.md"
# Upper bound is required: Poetry cannot resolve dependencies that cap
# themselves at <4.0 against an unbounded range. Equivalent to the old
# Poetry-style `python = "^3.11"`.
requires-python = ">=3.11,<4.0"
dependencies = ["pydantic>=2.12.0,<3.0.0"]

# Vendor SDKs are optional: a bare install brings no backend, and each provider
# imports its own inside the constructor that needs it. See ADR 0008 and the
# Import Conventions section of the README.
# `websockets<17` is a transitive package this library never imports. It is
# constrained because google-genai caps it at <17.0 while langsmith (via the
# langchain packages) allows >=15.0, and Poetry resolves that by locking two
# versions whose marker sets both include `extra == "all"`. Installing several
# extras together then installs both, file over file, leaving a package that is
# half 16.x and half 17.x -- which broke `import websockets` on Python 3.11.
# Remove the cap once google-genai accepts 17.x.
[project.optional-dependencies]
anthropic = [
    "anthropic>=0.96.0,<1.0.0",
    "langchain-anthropic>=1.3.1,<2.0.0",
    "websockets<17",
]
openai = ["openai>=2.15.0,<3.0.0", "langchain-openai>=1.1.7,<2.0.0", "websockets<17"]
vertex = [
    "google-genai>=1.61.0,<2.0.0",
    "langchain-google-genai>=4.3.7,<5.0.0",
    "websockets<17",
]
ollama = ["langchain-ollama>=1.0.1,<2.0.0", "websockets<17"]
all = [
    "anthropic>=0.96.0,<1.0.0",
    "langchain-anthropic>=1.3.1,<2.0.0",
    "openai>=2.15.0,<3.0.0",
    "langchain-openai>=1.1.7,<2.0.0",
    "google-genai>=1.61.0,<2.0.0",
    "langchain-google-genai>=4.3.7,<5.0.0",
    "langchain-ollama>=1.0.1,<2.0.0",
    "websockets<17",
]

[tool.poetry]
packages = [{ include = "reusable_llm_provider" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
coverage = "^7.12.0"
ruff = "^0.16.7"
vulture = "^2.16"
deptry = "^0.25.1"
# Used only by functional_tests and the env.py helper they call; no library
# module imports it on any path a consumer reaches.
python-dotenv = "^1.0"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (includes E402 import placement, F401 unused
# imports). I: import sorting. UP: pyupgrade. ERA001: commented-out code.
# ARG is deliberately NOT enabled -- unused arguments are usually signature
# contracts in interface implementations, not dead code.
#
# PLC0415 (imports inside functions) is also deliberately NOT enabled: this
# package imports vendor SDKs inside provider constructors on purpose, and a
# linter cannot tell that from an accidental local import.
select = ["E", "F", "I", "UP", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_version.py" = ["F841"]
# vulture's baseline is a list of bare names, not runnable code.
"deadcode-whitelist.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["reusable_llm_provider/tests"]
# Markers are registered in reusable_llm_provider/tests/conftest.py, which
# ships with the tests and so also applies when they run from a wheel.

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/functional_tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.deptry]
# deptry excludes `tests` by default but not a second test tree, and
# functional_tests is test code: it imports dotenv to read secrets/.env.
extend_exclude = ["functional_tests"]

# The unit suite lives inside the package, so it is scanned as source; it
# imports pytest, which is correctly a dev dependency.
[tool.deptry.per_rule_ignores]
DEP004 = ["pytest"]
# websockets is declared only to constrain a transitive version; see above.
DEP002 = ["websockets"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
